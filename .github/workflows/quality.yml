name: Quality checks
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required files
        run: test -f index.html && test -f main.js && test -f match.js && test -f styles.css && test -f README.md
      - name: Run matching tests
        run: node --test tests/match.test.mjs
      - name: Check for private credentials
        run: '! grep -R --exclude-dir=.git --exclude=quality.yml -E "(service_role|postgresql://postgres:)" .'
